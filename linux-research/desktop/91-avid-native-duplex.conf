# Managed by linux-research/duplex-driver.sh; HD Native desktop module only.
# PipeWire 1.4 / WirePlumber 0.5. No global graph/device changes.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        api.alsa.card.name = "Avid HD Native + 192 Duplex"
      }
    ]
    actions = {
      update-props = {
        device.description = "Avid HD Native + 192 Duplex"
        device.nick = "HD Native 192"
        api.alsa.use-acp = false
        api.alsa.use-ucm = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        api.alsa.card.name = "Avid HD Native + 192 Duplex"
      }
    ]
    actions = {
      update-props = {
        node.name = "avid_hd_native_duplex_out"
        node.description = "Avid HD Native — 192 I/O Duplex (saídas 1–2)"
        node.nick = "HD Native 192"
        audio.format = "S24LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 1024
        api.alsa.disable-mmap = true
        api.alsa.disable-batch = true
        api.alsa.soft-mixer = true
        node.latency = "1024/48000"
        node.max-latency = "1024/48000"
        priority.session = 10
        session.suspend-timeout-seconds = 5
        node.param.Props = { channelVolumes = [ 0.01 0.01 ] }
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        api.alsa.card.name = "Avid HD Native + 192 Duplex"
      }
    ]
    actions = {
      update-props = {
        node.name = "avid_hd_native_duplex_in"
        node.description = "Avid HD Native — 192 I/O Duplex (entradas 1–2)"
        node.nick = "HD Native 192"
        audio.format = "S24LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 1024
        api.alsa.disable-mmap = true
        api.alsa.disable-batch = true
        api.alsa.soft-mixer = true
        node.latency = "1024/48000"
        node.max-latency = "1024/48000"
        priority.session = 10
        session.suspend-timeout-seconds = 5
        node.param.Props = { channelVolumes = [ 1.0 1.0 ] }
      }
    }
  }
]
